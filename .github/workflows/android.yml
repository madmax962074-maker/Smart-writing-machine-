
name: Build Smart Writing Machine APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Extract project ZIP
        run: unzip -q SmartWritingMachine_Final_Integrated_Source.zip -d .

      - name: Build APK
        run: |
          cd SmartWritingMachine_Final
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartWritingMachine-debug-apk
          path: SmartWritingMachine_Final/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
